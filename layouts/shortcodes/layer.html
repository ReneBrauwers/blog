{{ $id := .Get 0 }}{{ $labels := dict "big-picture" "Big picture" "system" "System" "detail" "Detail" }}
<section class="layer layer-{{ $id }}" id="{{ $id }}" aria-labelledby="{{ $id }}-h">
<h2 id="{{ $id }}-h"><span class="layer-label">{{ index $labels $id | default $id }}</span></h2>
{{ .Inner | .Page.RenderString (dict "display" "block") }}
</section>
